<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>soloesAdri | Links</title>
    <link rel="icon" type="image/png" href="assets/images/nevado.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
    <main class="container">
        <button class="share-btn" id="shareBtn"><i class="fa-solid fa-ellipsis"></i></button>
        <header class="profile-header">
            <div class="profile-pic"></div>
            <h1>soloesAdri</h1>
            <p>Música y vibes 🎶✨</p>
        </header>
        <section class="links-container"></section>
    </main>
    <div class="modal-overlay" id="shareModal">
        <div class="modal-content">
            <button class="close-btn" id="closeBtn"><i class="fa-solid fa-xmark"></i></button>
            <h3>Share Linktree</h3>
            <div class="modal-profile">
                <div class="profile-pic-small"></div>
                <h4>soloesAdri</h4>
                <p>soloesadri-links.netlify.app</p>
            </div>
            <div class="share-options">
                <button id="copyBtn"><i class="fa-solid fa-link"></i> Copy</button>
                <a href="https://api.whatsapp.com/send?text=https://soloesadri-links.netlify.app" target="_blank"><i class="fa-brands fa-whatsapp"></i> WhatsApp</a>
                <a href="https://twitter.com/intent/tweet?url=https://soloesadri-links.netlify.app" target="_blank"><i class="fa-brands fa-x-twitter"></i> X</a>
            </div>
        </div>
    </div>
    <script src="js/main.js"></script>
    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) window.netlifyIdentity.on("login", () => document.location.href = "/admin/");
            });
        }
    </script>
</body>
</html>
